<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Finder</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 { font-size: 16px; font-weight: 600; }
    header span { font-size: 12px; color: #666; }

    .container { max-width: 960px; margin: 32px auto; padding: 0 24px 80px; }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #e0e0e0;
      margin-bottom: 24px;
    }

    .tab {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      user-select: none;
    }

    .tab.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
    .tab:hover:not(.active) { color: #333; }

    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }

    label { font-size: 12px; font-weight: 500; color: #555; text-transform: uppercase; letter-spacing: 0.04em; }

    input[type="text"] {
      border: 1px solid #d0d0d0;
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #1a1a1a; }

    button {
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 9px 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button:hover { background: #333; }
    button:disabled { background: #999; cursor: not-allowed; }

    .result-box {
      margin-top: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      padding: 16px;
      background: #fafafa;
      display: none;
    }

    .result-box.visible { display: block; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-verified   { background: #d4edda; color: #1a5c2a; }
    .badge-not_found  { background: #f8d7da; color: #721c24; }
    .badge-unverifiable { background: #fff3cd; color: #856404; }
    .badge-inconclusive { background: #e2e3e5; color: #383d41; }
    .badge-timed_out  { background: #fde8d8; color: #7d3c00; }

    .email-found { font-size: 18px; font-weight: 600; margin-top: 8px; font-family: monospace; }

    /* Batch */
    .drop-zone {
      border: 2px dashed #d0d0d0;
      border-radius: 6px;
      padding: 40px 24px;
      text-align: center;
      color: #666;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: #1a1a1a;
      background: #f0f0f0;
    }

    .drop-zone input { display: none; }
    .drop-zone p { margin-top: 8px; font-size: 12px; color: #999; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #666;
      padding: 8px 12px;
      border-bottom: 2px solid #e0e0e0;
    }

    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody td { padding: 10px 12px; font-size: 13px; }
    tbody td.email { font-family: monospace; }

    .progress-bar-wrap {
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      margin: 16px 0 8px;
      display: none;
    }

    .progress-bar-wrap.visible { display: block; }

    .progress-bar {
      height: 100%;
      background: #1a1a1a;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    .progress-label { font-size: 12px; color: #666; }

    .batch-actions { display: flex; gap: 12px; margin-top: 16px; align-items: center; }

    .verifying-row { color: #999; font-style: italic; }

    .hint { font-size: 12px; color: #888; margin-top: 8px; }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 1px solid #e0e0e0;
      background: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
    }

    footer a.logo svg { width: 48px; display: block; fill: #888888; }

    footer .made-by {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: #888;
    }
  </style>

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7844656534810081"
     crossorigin="anonymous"></script>
     
</head>
<body>

<header>
  <h1>Email Finder</h1>
  <span>Self-hosted • No credits • SMTP verification</span>
</header>

<div class="container">

  <div class="tabs">
    <div class="tab active" data-tab="single">Single Lookup</div>
    <div class="tab" data-tab="batch">Batch CSV</div>
  </div>

  <!-- ===== SINGLE LOOKUP ===== -->
  <div class="panel active" id="panel-single">
    <div class="card">
      <div class="form-row">
        <div class="field">
          <label>First name</label>
          <input type="text" id="s-first" placeholder="John" autocomplete="off">
        </div>
        <div class="field">
          <label>Last name</label>
          <input type="text" id="s-last" placeholder="Smith" autocomplete="off">
        </div>
        <div class="field">
          <label>Domain</label>
          <input type="text" id="s-domain" placeholder="acme.com" autocomplete="off">
        </div>
        <button id="s-btn" onclick="doLookup()">Find email</button>
      </div>

      <div id="s-result" class="result-box"></div>
    </div>
  </div>

  <!-- ===== BATCH CSV ===== -->
  <div class="panel" id="panel-batch">
    <div class="card">
      <div class="drop-zone" id="drop-zone" onclick="document.getElementById('csv-file').click()">
        <input type="file" id="csv-file" accept=".csv" onchange="handleFile(this.files[0])">
        <strong>Drop a CSV here or click to browse</strong>
        <p>Required columns: first_name, last_name, domain</p>
      </div>

      <div class="hint">
        Example:
        <code>first_name,last_name,domain</code> &nbsp;→&nbsp;
        <code>John,Smith,acme.com</code>
      </div>

      <div id="b-progress-wrap" class="progress-bar-wrap">
        <div id="b-progress-bar" class="progress-bar"></div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="b-progress-label" class="progress-label"></div>
        <button id="b-cancel" onclick="cancelBatch()" style="display:none;background:#eee;color:#333;padding:4px 12px;font-size:12px">Cancel</button>
      </div>

      <div id="b-actions" class="batch-actions" style="display:none">
        <button id="b-download" onclick="downloadCSV()" disabled>Download results CSV</button>
        <button id="b-retry" onclick="retryTimedOut()" style="display:none"></button>
        <span id="b-summary"></span>
      </div>

      <table id="b-table" style="display:none">
        <thead>
          <tr>
            <th>Name</th>
            <th>Domain</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="b-tbody"></tbody>
      </table>
    </div>
  </div>

</div><!-- /container -->

<footer>
  <a href="https://ebuka.dev" class="logo" target="_blank" rel="noopener">
    <svg viewBox="0 0 190.20682 60.837906" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(-9.9942511,-117.95498)">
        <ellipse cx="169.80473" cy="148.37392" rx="30.396332" ry="30.418936"/>
        <rect width="60.79266" height="16.846127" x="9.9942513" y="117.95501"/>
        <rect width="60.79266" height="16.846127" x="9.9942513" y="161.94676"/>
        <rect width="60.79266" height="16.846127" x="9.9942513" y="139.95088"/>
        <path d="m 76.658583,178.79282 30.396317,-60.79265 30.39633,60.79265 z"/>
      </g>
    </svg>
  </a>
  <span class="made-by">made with &lt;3 by Ebuka</span>
</footer>

<script>
  // --- Tab switching ---
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });

  // --- Drag-and-drop ---
  const dropZone = document.getElementById('drop-zone');
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  // --- Resumable-job storage (survives tab close / reload) ---
  const BATCH_KEY = 'emailFinder.batchJobId';
  const SINGLE_KEY = 'emailFinder.singleJob';
  const TERMINAL = ['completed', 'failed', 'cancelled'];

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch (_) { return null; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch (_) {}
  }
  function storageRemove(key) {
    try { localStorage.removeItem(key); } catch (_) {}
  }

  // --- Single lookup ---
  document.getElementById('s-domain').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLookup();
  });

  let singleJobId = null;
  let singlePollInterval = null;

  function showSingleSearching() {
    document.getElementById('s-result').innerHTML = `
      <span style="color:#666">Connecting to mail server…</span>
      <button onclick="cancelSingle()" style="margin-left:12px;background:#eee;color:#333;padding:4px 12px;font-size:12px">Cancel</button>
    `;
  }

  function renderSingleResult(data) {
    const badge = badgeHtml(data.status);
    let html = `${badge}`;
    if (data.email) {
      html += `<div class="email-found">${data.email}</div>`;
    }
    html += `<div style="margin-top:8px;font-size:12px;color:#666">`;
    if (data.catch_all) html += 'Domain accepts all addresses (catch-all). ';
    html += `${data.permutations_tried} pattern${data.permutations_tried !== 1 ? 's' : ''} tried.</div>`;
    document.getElementById('s-result').innerHTML = html;
  }

  function finishSingle() {
    clearInterval(singlePollInterval);
    singleJobId = null;
    storageRemove(SINGLE_KEY);
    document.getElementById('s-btn').disabled = false;
    document.getElementById('s-btn').textContent = 'Find email';
  }

  async function doLookup() {
    const first  = document.getElementById('s-first').value.trim();
    const last   = document.getElementById('s-last').value.trim();
    const domain = document.getElementById('s-domain').value.trim();
    const btn    = document.getElementById('s-btn');
    const box    = document.getElementById('s-result');

    if (!first || !last || !domain) {
      box.innerHTML = '<span style="color:#c00">Please fill in all three fields.</span>';
      box.classList.add('visible');
      return;
    }

    clearInterval(singlePollInterval);
    btn.disabled = true;
    btn.textContent = 'Searching…';
    showSingleSearching();
    box.classList.add('visible');

    try {
      const resp = await fetch('/lookup', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({first, last, domain}),
      });
      const data = await resp.json();

      if (!resp.ok) {
        box.innerHTML = `<span style="color:#c00">Error: ${data.detail || resp.statusText}</span>`;
        btn.disabled = false;
        btn.textContent = 'Find email';
        return;
      }

      singleJobId = data.job_id;
      storageSet(SINGLE_KEY, JSON.stringify({id: singleJobId, first, last, domain}));
      singlePollInterval = setInterval(pollSingleJob, 1500);
      pollSingleJob();
    } catch (err) {
      box.innerHTML = `<span style="color:#c00">Network error: ${err.message}</span>`;
      btn.disabled = false;
      btn.textContent = 'Find email';
    }
  }

  async function pollSingleJob() {
    if (!singleJobId) return;
    try {
      const resp = await fetch(`/jobs/${singleJobId}`);
      if (resp.status === 404) {
        finishSingle();
        document.getElementById('s-result').innerHTML =
          '<span style="color:#666">Previous lookup is no longer available (server restarted).</span>';
        return;
      }
      if (!resp.ok) return;
      const job = await resp.json();

      if (job.status === 'completed') {
        finishSingle();
        if (job.results && job.results[0]) renderSingleResult(job.results[0]);
      } else if (job.status === 'cancelled') {
        finishSingle();
        document.getElementById('s-result').innerHTML = '<span style="color:#666">Lookup cancelled.</span>';
      } else if (job.status === 'failed') {
        finishSingle();
        document.getElementById('s-result').innerHTML = '<span style="color:#c00">Lookup failed.</span>';
      }
    } catch (_) {}
  }

  async function cancelSingle() {
    if (!singleJobId) return;
    try {
      await fetch(`/jobs/${singleJobId}/cancel`, { method: 'POST' });
    } catch (_) {}
    pollSingleJob();
  }

  // --- Batch ---
  let currentJobId = null;
  let pollInterval = null;

  async function handleFile(file) {
    if (!file) return;

    // Reset state
    clearInterval(pollInterval);
    currentJobId = null;
    renderedRowCount = 0;
    document.getElementById('b-tbody').innerHTML = '';
    document.getElementById('b-table').style.display = 'none';
    document.getElementById('b-actions').style.display = 'none';
    document.getElementById('b-download').disabled = true;
    document.getElementById('b-summary').textContent = '';
    document.getElementById('b-cancel').style.display = 'none';

    const formData = new FormData();
    formData.append('file', file);

    document.getElementById('b-progress-label').textContent = 'Uploading…';
    document.getElementById('b-progress-wrap').classList.add('visible');

    try {
      const resp = await fetch('/batch', { method: 'POST', body: formData });
      const data = await resp.json();

      if (!resp.ok) {
        document.getElementById('b-progress-label').textContent = `Error: ${data.detail || resp.statusText}`;
        return;
      }

      currentJobId = data.job_id;
      storageSet(BATCH_KEY, currentJobId);
      document.getElementById('b-cancel').style.display = '';
      pollInterval = setInterval(pollJob, 1500);
      pollJob();
    } catch (err) {
      document.getElementById('b-progress-label').textContent = `Upload failed: ${err.message}`;
    }
  }

  async function pollJob() {
    if (!currentJobId) return;
    try {
      const resp = await fetch(`/jobs/${currentJobId}`);
      if (resp.status === 404) {
        clearInterval(pollInterval);
        currentJobId = null;
        storageRemove(BATCH_KEY);
        document.getElementById('b-progress-label').textContent =
          'Previous batch job is no longer available (server restarted).';
        document.getElementById('b-cancel').style.display = 'none';
        return;
      }
      if (!resp.ok) return;
      const job = await resp.json();

      const pct = Math.round((job.progress || 0) * 100);
      document.getElementById('b-progress-bar').style.width = pct + '%';
      document.getElementById('b-progress-label').textContent =
        `${job.done || 0} / ${job.total || 0} contacts processed…`;

      appendNewRows(job.results || []);

      if (TERMINAL.includes(job.status)) {
        clearInterval(pollInterval);
        document.getElementById('b-cancel').style.display = 'none';
        storageRemove(BATCH_KEY);
        let label;
        if (job.status === 'completed') label = `Done — ${job.total} contacts processed`;
        else if (job.status === 'cancelled') label = `Cancelled after ${job.done} of ${job.total} contacts`;
        else label = `Failed after ${job.done} contacts`;
        document.getElementById('b-progress-label').textContent = label;
        document.getElementById('b-actions').style.display = 'flex';
        document.getElementById('b-download').disabled = false;
        summarize(job.results || []);
        const timedOut = (job.results || []).filter(r => r.status === 'timed_out');
        const retryBtn = document.getElementById('b-retry');
        if (timedOut.length > 0) {
          retryBtn.textContent = `Retry timed out (${timedOut.length})`;
          retryBtn.style.display = '';
          retryBtn.disabled = false;
        } else {
          retryBtn.style.display = 'none';
        }
      }
    } catch (_) {}
  }

  async function cancelBatch() {
    if (!currentJobId) return;
    try {
      await fetch(`/jobs/${currentJobId}/cancel`, { method: 'POST' });
    } catch (_) {}
    pollJob();
  }

  let renderedRowCount = 0;

  function appendNewRows(results) {
    const tbody = document.getElementById('b-tbody');
    for (let i = renderedRowCount; i < results.length; i++) {
      const r = results[i];
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(r.first)} ${esc(r.last)}</td>
        <td>${esc(r.domain)}</td>
        <td class="email">${r.email ? esc(r.email) : '—'}</td>
        <td>${badgeHtml(r.status)}</td>
      `;
      tbody.appendChild(tr);
    }
    renderedRowCount = results.length;
    document.getElementById('b-table').style.display = results.length ? 'table' : 'none';
  }

  function summarize(results) {
    const counts = {};
    results.forEach(r => counts[r.status] = (counts[r.status] || 0) + 1);
    const parts = Object.entries(counts).map(([s, n]) => `${n} ${s}`);
    document.getElementById('b-summary').textContent = parts.join(' · ');
  }

  async function downloadCSV() {
    if (!currentJobId) return;
    const a = document.createElement('a');
    a.href = `/jobs/${currentJobId}/csv`;
    a.download = '';
    a.click();
  }

  async function retryTimedOut() {
    if (!currentJobId) return;
    const retryBtn = document.getElementById('b-retry');
    retryBtn.disabled = true;
    retryBtn.textContent = 'Retrying…';

    try {
      const resp = await fetch(`/jobs/${currentJobId}/retry`, { method: 'POST' });
      const data = await resp.json();
      if (!resp.ok) {
        retryBtn.textContent = `Retry failed: ${data.detail || resp.statusText}`;
        retryBtn.disabled = false;
        return;
      }

      // Reset to a fresh polling state for the retry job
      clearInterval(pollInterval);
      currentJobId = data.job_id;
      storageSet(BATCH_KEY, currentJobId);
      renderedRowCount = 0;
      document.getElementById('b-tbody').innerHTML = '';
      document.getElementById('b-table').style.display = 'none';
      document.getElementById('b-actions').style.display = 'none';
      document.getElementById('b-download').disabled = true;
      document.getElementById('b-summary').textContent = '';
      document.getElementById('b-progress-label').textContent = 'Retrying timed-out contacts…';
      document.getElementById('b-progress-wrap').classList.add('visible');
      document.getElementById('b-cancel').style.display = '';

      pollInterval = setInterval(pollJob, 1500);
      pollJob();
    } catch (err) {
      retryBtn.textContent = `Retry failed: ${err.message}`;
      retryBtn.disabled = false;
    }
  }

  // --- Helpers ---
  function badgeHtml(status) {
    return `<span class="status-badge badge-${status}">${status}</span>`;
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // --- Resume in-flight jobs after reload / reopening the tab ---
  async function restoreJobs() {
    const batchId = storageGet(BATCH_KEY);
    if (batchId) {
      try {
        const resp = await fetch(`/jobs/${batchId}`);
        if (resp.status === 404) {
          storageRemove(BATCH_KEY);
          document.getElementById('b-progress-wrap').classList.add('visible');
          document.getElementById('b-progress-label').textContent =
            'Previous batch job is no longer available (server restarted).';
          const batchTab = document.querySelector('.tab[data-tab="batch"]');
          if (batchTab) batchTab.click();
        } else if (resp.ok) {
          const job = await resp.json();
          currentJobId = batchId;
          renderedRowCount = 0;
          document.getElementById('b-tbody').innerHTML = '';
          document.getElementById('b-actions').style.display = 'none';
          document.getElementById('b-download').disabled = true;
          document.getElementById('b-summary').textContent = '';
          document.getElementById('b-progress-wrap').classList.add('visible');
          if (!TERMINAL.includes(job.status)) {
            document.getElementById('b-cancel').style.display = '';
          }
          const batchTab = document.querySelector('.tab[data-tab="batch"]');
          if (batchTab) batchTab.click();
          pollInterval = setInterval(pollJob, 1500);
          pollJob();
        }
      } catch (_) {}
    }

    const singleRaw = storageGet(SINGLE_KEY);
    if (singleRaw) {
      try {
        const stored = JSON.parse(singleRaw);
        const resp = await fetch(`/jobs/${stored.id}`);
        if (resp.status === 404) {
          storageRemove(SINGLE_KEY);
          document.getElementById('s-result').innerHTML =
            '<span style="color:#666">Previous lookup is no longer available (server restarted).</span>';
          document.getElementById('s-result').classList.add('visible');
        } else if (resp.ok) {
          document.getElementById('s-first').value = stored.first;
          document.getElementById('s-last').value = stored.last;
          document.getElementById('s-domain').value = stored.domain;
          singleJobId = stored.id;
          const btn = document.getElementById('s-btn');
          btn.disabled = true;
          btn.textContent = 'Searching…';
          showSingleSearching();
          document.getElementById('s-result').classList.add('visible');
          singlePollInterval = setInterval(pollSingleJob, 1500);
          pollSingleJob();
        }
      } catch (_) {
        storageRemove(SINGLE_KEY);
      }
    }
  }

  restoreJobs();
</script>

</body>
</html>
